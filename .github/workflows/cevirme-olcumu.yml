name: Çevirme ölçümü
on: push
permissions:
  contents: read
jobs:
  olc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surum:
          - { ad: eski, ref: 0844f57326b96e5fb24743abee3a094c5c93df76 }
          - { ad: yeni, ref: 82181f78fade03b4cb4b20ccf41e80f51759a203 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.surum.ref }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python3 olcum/yamala.py app/mobile
      - working-directory: app/mobile
        run: |
          for i in 1 2 3; do npm ci && break; sleep $((i * 10)); done
          npx expo prebuild --platform android --no-install
      - working-directory: app/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: CEVIRME=0 bash olcum/olc.sh app/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/olc"
      - if: always()
        run: cat "$RUNNER_TEMP/olc/ozet.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olcum-${{ matrix.surum.ad }}
          path: ${{ runner.temp }}/olc
          if-no-files-found: ignore
